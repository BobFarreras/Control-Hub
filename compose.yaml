name: control-hub

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { APP: web }
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [application]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { APP: api }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://control_hub:local_only@postgres:5432/control_hub
      REDIS_URL: redis://valkey:6379
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [application, data]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { APP: worker }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://control_hub:local_only@postgres:5432/control_hub
      REDIS_URL: redis://valkey:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args: { APP: database }
    command: ["pnpm", "--filter", "@control-hub/database", "migrate"]
    environment:
      DATABASE_URL: postgres://control_hub:local_only@postgres:5432/control_hub
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: control_hub
      POSTGRES_USER: control_hub
      POSTGRES_PASSWORD: local_only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_hub -d control_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [data]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    security_opt:
      - no-new-privileges:true
    networks: [application]
    restart: unless-stopped

networks:
  application:
  data:

volumes:
  postgres-data:
  valkey-data:
