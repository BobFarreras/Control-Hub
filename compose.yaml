services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT is required}:3001"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [application]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: info
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-control-hub@localhost.test}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3001}
      DATABASE_URL: postgres://control_hub_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/control_hub
      REDIS_URL: redis://valkey:6379
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT is required}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [application, data]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://control_hub_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/control_hub
      REDIS_URL: redis://valkey:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://control_hub_admin:${POSTGRES_ADMIN_PASSWORD:-}@postgres:5432/control_hub
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: control_hub
      POSTGRES_USER: control_hub_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_hub_admin -d control_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [data]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:?MAILPIT_SMTP_PORT is required}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:?MAILPIT_UI_PORT is required}:8025"
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    security_opt:
      - no-new-privileges:true
    networks: [application]
    restart: unless-stopped

networks:
  application:
  data:

volumes:
  postgres-data:
  valkey-data:
