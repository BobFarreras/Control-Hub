name: CI

# Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever controls the action
# repository can move v7 to different code, and that code runs with this workflow's token.
# Dependabot updates the SHAs and records the version in the trailing comment.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"

jobs:
  repository-standards:
    name: Repository standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            ARCHITECTURE.md
            BRANCHING.md
            CLAUDE.md
            DESIGN_SYSTEM.md
            DEVELOPMENT.md
            IMPLEMENTATION_PLAN.md
            INTERNATIONALIZATION.md
            PRODUCT_REQUIREMENTS.md
            README.md
            SECURITY.md
            SECURITY_ARCHITECTURE.md
            docs/README.md
            docs/development/current-state.md
            docs/development/troubleshooting.md
            docs/security/container-checklist.md
            docs/security/threat-model.md
            docs/specifications/connector-security.md
            docs/specifications/permissions.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject conflict markers and trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Merge conflict marker found"
            exit 1
          fi
          if git grep -nI -E '[[:blank:]]+$' -- '*.md' '*.yml' '*.yaml'; then
            echo "Trailing whitespace found"
            exit 1
          fi

  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: control_hub
          POSTGRES_USER: control_hub_admin
          POSTGRES_PASSWORD: ci_admin_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_hub_admin -d control_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The integration suites skip themselves when these are absent, so CI would go green
      # without ever proving tenant isolation. They are required, not optional.
      TEST_DATABASE_URL: postgres://control_hub_app:ci_app_only@127.0.0.1:5432/control_hub
      TEST_DATABASE_ADMIN_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
      MIGRATION_DATABASE_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the supported Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create the unprivileged runtime role
        shell: bash
        env:
          PGPASSWORD: ci_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U control_hub_admin -d control_hub -v ON_ERROR_STOP=1 \
            -c "create role control_hub_app login nosuperuser nocreatedb nocreaterole noinherit password 'ci_app_only';"

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        shell: bash
        # Before any suite: several tests under `pnpm test` also need the schema.
        run: pnpm --filter @control-hub/database migrate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # `pnpm test` is `turbo test`, which only reaches workspace packages. The scripts at the
      # root are not one, so nothing ran them until the dependency log gave them logic worth
      # getting wrong.
      - name: Root script tests
        run: pnpm test:scripts

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  previous-version:
    name: Previous version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # D4 promises that an update can be undone: the previous version has to still work against a
    # database this one has already migrated. That promise is either exercised or it is decoration,
    # and the way it fails is quiet -- a column disappears, and the rollback everybody is counting
    # on stops working months before anybody needs it.
    #
    # The job always runs. `scripts/release-gate.mjs` counts a skipped check as a failure, so a
    # job that conditionally skips itself would block every release; when there is nothing to
    # compare it takes a fast path inside the job instead.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: control_hub
          POSTGRES_USER: control_hub_admin
          POSTGRES_PASSWORD: ci_admin_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_hub_admin -d control_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://control_hub_app:ci_app_only@127.0.0.1:5432/control_hub
      TEST_DATABASE_ADMIN_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
      MIGRATION_DATABASE_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, and the history back to the previous one. The default shallow fetch has neither.
          fetch-depth: 0

      - name: Use the supported Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Needs no database and answers the half the suite below cannot: a column the previous
      # version writes but no test reads can be dropped without turning anything red.
      - name: Migrations that remove something
        run: node scripts/migration-compatibility.mjs

      - name: Find the previous version
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          # wc -l, not grep -c: grep exits 1 on no match, and the || true that silences that
          # also silences the script failing, which would leave the count empty and the branch below
          # deciding on an error message.
          migrations="$(node scripts/migration-compatibility.mjs --list | wc -l)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            echo "No version tag yet: nothing has been released that this could break." >> "$GITHUB_STEP_SUMMARY"
            echo "exercise=false" >> "$GITHUB_OUTPUT"
          elif [ "$migrations" -eq 0 ]; then
            echo "No migrations since $previous: the schema it runs against is the one it shipped with." >> "$GITHUB_STEP_SUMMARY"
            echo "exercise=false" >> "$GITHUB_OUTPUT"
          else
            echo "Running $previous against a database with $migrations new migration(s)." >> "$GITHUB_STEP_SUMMARY"
            echo "exercise=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the unprivileged runtime role
        if: steps.scope.outputs.exercise == 'true'
        shell: bash
        env:
          PGPASSWORD: ci_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U control_hub_admin -d control_hub -v ON_ERROR_STOP=1 \
            -c "create role control_hub_app login nosuperuser nocreatedb nocreaterole noinherit password 'ci_app_only';"

      - name: Enable the pinned package manager
        if: steps.scope.outputs.exercise == 'true'
        run: corepack enable

      - name: Restore the pnpm store
        if: steps.scope.outputs.exercise == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          # Two lockfiles are installed in this job, so the key covers both.
          key: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-n1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.scope.outputs.exercise == 'true'
        run: pnpm install --frozen-lockfile

      # The database ends up where an installation's would be after the update: this version's
      # schema, with the previous version's code about to be pointed at it.
      - name: Migrate to this version
        if: steps.scope.outputs.exercise == 'true'
        run: pnpm --filter @control-hub/database migrate

      - name: Check out the previous version
        if: steps.scope.outputs.exercise == 'true'
        shell: bash
        # Through the environment rather than into the script text: `${{ }}` is substituted
        # textually, and a tag name is not something to paste into a shell.
        env:
          PREVIOUS: ${{ steps.scope.outputs.previous }}
        run: |
          set -euo pipefail
          # Outside the repository: inside it, pnpm and turbo would treat the second tree as part
          # of this workspace and install the wrong dependency graph into it.
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS"
          cd "$RUNNER_TEMP/previous"
          pnpm install --frozen-lockfile

      # The migration runner is idempotent, so this is the rollback rehearsal in full: the old code
      # starts against the new schema, applies nothing, and either works or does not.
      - name: Run the previous version against this schema
        if: steps.scope.outputs.exercise == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/previous"
          pnpm test:integration

  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # `scripts/run-web.mjs` refuses to start without an explicit port and has no default,
      # because isolated agent workspaces each get their own and a hardcoded one would have put
      # two of them on the same socket. Every workspace carries it in `.env` -- which is exactly
      # why this went unseen: CI has no `.env`, so the web server never started here at all.
      WEB_PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the supported Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser Playwright drives
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end to end suite
        # @visual is excluded on purpose. Its baselines are committed with a -win32 suffix
        # because they were produced on a developer machine, and a Linux runner renders text
        # differently, so they would fail on rendering rather than on a real regression.
        # Bringing them here means generating Linux baselines in a container first.
        run: pnpm exec playwright test --grep-invert "@visual"

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  authenticated-end-to-end:
    name: Authenticated end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: control_hub_e2e
          POSTGRES_USER: control_hub_admin
          POSTGRES_PASSWORD: ci_admin_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_hub_admin -d control_hub_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Better Auth sends a verification message when the fixture account is created, and the
      # mail sender is awaited, so a run without somewhere to deliver it fails at the seed.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    env:
      DATABASE_URL: postgres://control_hub_app:ci_app_only@127.0.0.1:5432/control_hub_e2e
      MIGRATION_DATABASE_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub_e2e
      REDIS_URL: redis://127.0.0.1:6379
      API_HOST: 127.0.0.1
      API_PORT: "4000"
      API_INTERNAL_URL: http://127.0.0.1:4000
      LOG_LEVEL: warn
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: control-hub@localhost.test
      # The browser origin and the origin the API trusts have to be the same string. They are
      # checked against each other on every mutating request, so 127.0.0.1 against localhost
      # fails every PATCH in the suite with ORIGIN_DENIED.
      APP_ORIGIN: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      # The port the web server is actually started on, and it has to agree with the two URLs
      # above. There is no default for it; see the note in the `end-to-end` job.
      WEB_PORT: 3001
      WEBAUTHN_RP_ID: 127.0.0.1
      WEBAUTHN_ORIGIN: http://127.0.0.1:3001
      E2E_OWNER_EMAIL: e2e-owner@controlhub.test
      E2E_TENANT_NAME: Control Hub E2E
      E2E_TENANT_SLUG: control-hub-e2e
      # Both the API and the web read this. Without it the projects routes are never declared,
      # and projects.authenticated.spec.ts would be testing a 404. Same for `connectors` and
      # integrations.authenticated.spec.ts — which runs without `CONNECTOR_KEY_RING` on purpose,
      # so it exercises the deployment that cannot hold a secret.
      # `infrastructure` opens the module infrastructure.authenticated.spec.ts drives; with it
      # closed there is no route, no menu entry and no screen, which is the point of the flag.
      # `mcp` opens the agent surface. Without it there is no discovery document, no
      # registration endpoint and no consent screen, and mcp-consent.authenticated.spec.ts
      # skips itself rather than failing about a flag -- which is a suite that says nothing
      # about the one flow in this product a person walks with an agent on the other side.
      # `mail` declares the mailbox routes. It was never the reason
      # support-mailbox.authenticated.spec.ts failed, but with it off that spec drives a screen
      # whose three fetches all come back refused, and it would pass on the empty fallback --
      # green while proving nothing.
      CONTROL_HUB_FLAGS: projects_and_time,attendance,connectors,infrastructure,usage_costs,mail,mcp
      # The bare origin an MCP client reaches this API at, and so the issuer it announces. Not
      # APP_ORIGIN, which is the web app, and never with a path: a client compares this string
      # to the one in the discovery document.
      MCP_ISSUER: http://127.0.0.1:4000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the supported Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create the unprivileged runtime role
        shell: bash
        env:
          PGPASSWORD: ci_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U control_hub_admin -d control_hub_e2e -v ON_ERROR_STOP=1 \
            -c "create role control_hub_app login nosuperuser nocreatedb nocreaterole noinherit password 'ci_app_only';"

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser Playwright drives
        run: pnpm exec playwright install --with-deps chromium

      - name: Mint this run's secrets
        shell: bash
        # Generated per run, never committed and never printed. The account they belong to
        # exists only in this job's throwaway database, which goes away with the runner.
        run: |
          set -euo pipefail
          auth_secret="$(openssl rand -hex 32)"
          owner_password="$(openssl rand -hex 20)"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$owner_password"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "E2E_OWNER_PASSWORD=$owner_password"
            echo "E2E_CREDENTIALS_FILE=$GITHUB_WORKSPACE/.e2e/credentials.json"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm --filter @control-hub/database migrate

      - name: Seed the end to end fixture
        # Enrols the second factor through Better Auth's own enable and verify pair, and
        # refuses to write credentials unless the account ends up with MFA switched on.
        run: pnpm db:seed:e2e

      - name: Run the authenticated end to end suite
        run: pnpm test:e2e:authenticated

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-authenticated
          # `.e2e/` is deliberately not uploaded: it holds the account's TOTP secret, and an
          # artifact is readable by anyone who can see the run. The traces under test-results
          # can carry this run's session cookie, which is spent the moment the job's database
          # disappears with the runner.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job wide, not on the step that starts the stack: every command that reads `compose.yaml`
    # interpolates the whole file, `build`, `logs` and `down` included, so scoping these to one
    # step left the other three failing on a missing value instead of on anything real.
    env:
      # These three now carry `:-` rather than `:?` in `compose.yaml`, because production supplies
      # them as mounted files and `:?` would abort the deployment that has no environment value to
      # give. They are still required here: an empty password does not make a working stack, it
      # makes Postgres refuse to initialise several seconds later and with a worse explanation.
      POSTGRES_ADMIN_PASSWORD: ci_admin_only
      POSTGRES_APP_PASSWORD: ci_app_only
      BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_for_validation
      # The published ports do still use `:?`, so the file does not interpolate without them --
      # which is why `build`, `logs` and `down` all failed together on `WEB_PORT` rather than on
      # anything about an image. The two the health checks below reach have to keep these values;
      # the rest only have to be free.
      WEB_PORT: 3001
      API_PORT: 4000
      POSTGRES_PORT: 5432
      REDIS_PORT: 6379
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_UI_PORT: 8025
      # Deliberately not empty. An installation chooses its modules here and the value has to
      # travel from `.env` through the compose files into three separate containers; with the
      # variable unset every one of them reads «no modules», which is also what a correctly
      # plumbed stack looks like. Naming one is what makes the check below able to fail.
      CONTROL_HUB_FLAGS: projects_and_time
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build every service image
        # Nothing built these before, so two faults shipped unnoticed: the runtime went through
        # a package manager that tried to fetch itself onto a read-only filesystem, and the
        # bundled server crashed on boot. `pnpm build` passing says nothing about either.
        run: docker compose build

      - name: Start the stack and wait for it to be healthy
        run: docker compose up -d --wait

      - name: Check nothing came back up on its own
        # `up -d --wait` waits on healthchecks, and a service without one only has to reach
        # `running` -- which a container that dies and is restarted does, over and over. The worker
        # has no healthcheck, demanded a BETTER_AUTH_SECRET no compose file gave it and no line of
        # it reads, and crash-looped from the first release: no update check, no alerts, no
        # connector schedules, no usage collection, in every installation there has ever been.
        # Every check in this job passed throughout, because none of them asked.
        #
        # A restart count above zero a few seconds in means the process is not surviving boot. The
        # pause is what makes that true rather than racy: a loop that fast has restarted by then.
        run: |
          set -euo pipefail
          sleep 15
          failed=no
          for id in $(docker compose ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$id")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$id")
            state=$(docker inspect -f '{{.State.Status}}' "$id")
            exited=$(docker inspect -f '{{.State.ExitCode}}' "$id")
            echo "$name: $state, exit $exited, $restarts restart(s)"
            # `migrate` is meant to run once and exit 0; anything else must still be running.
            case "$name:$state:$exited" in
              *:exited:0) ;;
              *:running:*) [ "$restarts" -eq 0 ] || failed=yes ;;
              *) failed=yes ;;
            esac
          done
          [ "$failed" = no ] || { echo "a service is not surviving its own boot"; exit 1; }

      - name: Check the running services answer
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4000/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3001/ca/login | grep -q 200

      - name: Ask the web tier for an API path, not only for a page
        # The request nobody was making. `apps/web/next.config.ts` proxies /api and /health onward
        # with a Next rewrite, and a rewrite destination is compiled into the bundle rather than
        # read at boot -- so an image built without API_INTERNAL_URL proxies to itself and answers
        # `Internal Server Error` to every browser, while every check above still passes. That
        # shipped, and was found by an operator clicking the verification link in their own mail.
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3001/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/auth/get-session)
          echo "/api/auth/get-session through the web tier: $status"
          # Any answer from the API is an answer. A 5xx here is the web tier failing to reach it,
          # which is the whole defect; asserting a particular status would tie this to Better Auth.
          case "$status" in 5??) echo "the web tier could not reach the API"; exit 1 ;; esac

      - name: Check the chosen modules reached every service that reads them
        # Three containers, because a flag on in one and off in another is a screen that renders
        # against routes answering 404. No compose file named this variable at all until an
        # installation was told a module was on and came up with an empty sidebar.
        run: |
          set -euo pipefail
          for service in web api worker; do
            # `|| true` so an unset variable arrives here as an empty string and fails on the
            # comparison, which names the service, rather than on printenv's exit code.
            value=$(docker compose exec -T "$service" printenv CONTROL_HUB_FLAGS 2>/dev/null | tr -d '\r' || true)
            echo "$service: ${value:-<unset>}"
            test "$value" = "$CONTROL_HUB_FLAGS"
          done

      - name: Start it again the way an installation does, with the secrets as mounted files
        # Everything above runs the development composition, where the credentials are environment
        # values. A real installation mounts them as files, and that is a different mechanism with
        # its own failure: Compose ignores `uid`, `gid` and `mode` on a secret -- they are Swarm
        # attributes it warns about and discards -- so a secret arrives owned by whoever owns it on
        # the host. All seven were root, PostgreSQL initialises as uid 70, and the first real
        # installation could not read a single one of its own. The ownership below is the
        # ownership `deploy/install.sh` assigns, and it is the point of this step.
        env:
          SECRETS_DIRECTORY: /tmp/control-hub-secrets
          MCP_ISSUER: https://ci.invalid
          SMTP_HOST: 127.0.0.1
          SMTP_FROM: control-hub@ci.invalid
        run: |
          set -euo pipefail
          docker compose down -v

          mkdir -p "$SECRETS_DIRECTORY"
          printf '%s' "$POSTGRES_ADMIN_PASSWORD" > "$SECRETS_DIRECTORY/postgres_admin_password"
          printf '%s' "$POSTGRES_APP_PASSWORD" > "$SECRETS_DIRECTORY/postgres_app_password"
          printf '%s' "$BETTER_AUTH_SECRET" > "$SECRETS_DIRECTORY/better_auth_secret"
          printf '%s' "postgres://control_hub_admin:$POSTGRES_ADMIN_PASSWORD@postgres:5432/control_hub" \
            > "$SECRETS_DIRECTORY/migration_database_url"
          printf '%s' "postgres://control_hub_app:$POSTGRES_APP_PASSWORD@postgres:5432/control_hub" \
            > "$SECRETS_DIRECTORY/database_url"
          sudo chown 70:70 "$SECRETS_DIRECTORY/postgres_admin_password" "$SECRETS_DIRECTORY/postgres_app_password"
          sudo chown 1000:1000 \
            "$SECRETS_DIRECTORY/better_auth_secret" \
            "$SECRETS_DIRECTORY/migration_database_url" \
            "$SECRETS_DIRECTORY/database_url"
          sudo chmod 0400 "$SECRETS_DIRECTORY"/*
          ls -ln "$SECRETS_DIRECTORY"

          docker compose -f compose.yaml -f compose.production.yaml up -d --wait
          curl -fsS http://127.0.0.1:3001/health/ready | tee /dev/stderr | grep -q '"status":"ready"'

      - name: Show what failed
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 60

      - name: Tear down
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerable-dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the supported Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit the dependency tree
        shell: bash
        # Gitleaks finds committed secrets; nothing until now looked at known vulnerabilities
        # in what we install. High and critical fail the build, lower severities are reported.
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate || true
          pnpm audit --audit-level high

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
