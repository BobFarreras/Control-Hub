name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-standards:
    name: Repository standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            ARCHITECTURE.md
            BRANCHING.md
            DESIGN_SYSTEM.md
            DEVELOPMENT.md
            IMPLEMENTATION_PLAN.md
            INTERNATIONALIZATION.md
            PRODUCT_REQUIREMENTS.md
            README.md
            SECURITY.md
            SECURITY_ARCHITECTURE.md
            docs/README.md
            docs/security/container-checklist.md
            docs/security/threat-model.md
            docs/specifications/connector-security.md
            docs/specifications/permissions.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject conflict markers and trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Merge conflict marker found"
            exit 1
          fi
          if git grep -nI -E '[[:blank:]]+$' -- '*.md' '*.yml' '*.yaml'; then
            echo "Trailing whitespace found"
            exit 1
          fi

  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: control_hub
          POSTGRES_USER: control_hub_admin
          POSTGRES_PASSWORD: ci_admin_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_hub_admin -d control_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The integration suites skip themselves when these are absent, so CI would go green
      # without ever proving tenant isolation. They are required, not optional.
      TEST_DATABASE_URL: postgres://control_hub_app:ci_app_only@127.0.0.1:5432/control_hub
      TEST_DATABASE_ADMIN_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
      MIGRATION_DATABASE_URL: postgres://control_hub_admin:ci_admin_only@127.0.0.1:5432/control_hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create the unprivileged runtime role
        shell: bash
        env:
          PGPASSWORD: ci_admin_only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U control_hub_admin -d control_hub -v ON_ERROR_STOP=1 \
            -c "create role control_hub_app login nosuperuser nocreatedb nocreaterole noinherit password 'ci_app_only';"

      - name: Run checks when the workspace exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "Application workspace not initialized; documentation checks only."
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile
          # Before any suite: several tests under `pnpm test` also need the schema.
          pnpm --filter @control-hub/database migrate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
