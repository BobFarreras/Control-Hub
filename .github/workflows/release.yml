name: Release

# Separate from `ci.yml` on purpose, and not because the file was getting long. The two have
# opposite failure modes: CI protects `develop` and its worst outcome is a branch that will not
# merge, while this one produces artefacts other people install and its worst outcome is a signed
# image nobody meant to publish. Mixing them makes one set of permissions serve both, and this one
# needs `packages: write` and an OIDC identity that CI has no business holding.
#
# Actions are pinned by commit SHA for the same reason as in `ci.yml`: a tag is mutable, and here
# whoever moved it would be running inside a job that can push to the registry and sign as us.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [develop]

permissions:
  contents: read

concurrency:
  # Never cancelled halfway. A cancelled CI run costs a re-run; a cancelled publish can leave three
  # images of four pushed, which is a release that half exists.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.identify.outputs.channel }}
      version: ${{ steps.identify.outputs.version }}
      registry: ${{ steps.identify.outputs.registry }}
      build: ${{ steps.identify.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Identify what is being published
        id: identify
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # `edge` does not name anything and is not meant to: it exists so the installation path
            # can be exercised against what is on `develop` today, not so anybody depends on it.
            echo "channel=edge" >> "$GITHUB_OUTPUT"
            echo "version=edge" >> "$GITHUB_OUTPUT"
          fi
          # A registry namespace is case sensitive where a GitHub owner is not, so pushing as
          # `BobFarreras` and pulling as `bobfarreras` would be two repositories, one of them empty.
          echo "registry=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # Commit and date, which is what `apps/api/src/version.ts` reports when somebody asks an
          # installation which build it is. Twelve characters, because a release is not the place to
          # find out that seven collide.
          echo "build=${GITHUB_SHA:0:12}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a commit the gates have not passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Check runs hang off the commit rather than the ref, which is the whole reason this works
          # for a tag: `ci.yml` does not run on tag pushes, but the commit the tag points at has
          # already been through it on `main`. On `develop` this workflow starts from the same push
          # as CI, so waiting is the normal case and not an error -- hence the loop.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > checks.json
            set +e
            node scripts/release-gate.mjs < checks.json
            status=$?
            set -e
            [ "$status" -eq 0 ] && break
            [ "$status" -ne 75 ] && exit 1
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the required checks did not finish within 45 minutes; nothing published"
              exit 1
            fi
            sleep 30
          done

  publish:
    name: Publish images
    needs: gate
    runs-on: ubuntu-latest
    # Two hours because the images are built for arm64 as well, under emulation. It is the slowest
    # thing here by a wide margin and the reason this workflow does not run on every commit.
    timeout-minutes: 120
    permissions:
      # `contents: write` only so the manifest can be attached to the release the tag created.
      contents: write
      packages: write
      # The OIDC identity keyless signing uses. This is what replaces custody of a private key, and
      # it is also why this job is not allowed to be reusable by anything else.
      id-token: write
      attestations: write
    env:
      REGISTRY: ${{ needs.gate.outputs.registry }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and the full history: the manifest reports what changed since the previous
          # version, and a shallow clone cannot answer that.
          fetch-depth: 0

      - name: Set up emulation for the second architecture
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the API image
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/control-hub-api:${{ env.VERSION }}
          build-args: CONTROL_HUB_BUILD=${{ needs.gate.outputs.build }}
          sbom: ${{ needs.gate.outputs.channel == 'release' }}
          provenance: ${{ needs.gate.outputs.channel == 'release' && 'mode=max' || false }}
          cache-from: type=gha,scope=control-hub-api
          cache-to: type=gha,mode=max,scope=control-hub-api

      - name: Build and push the worker image
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/control-hub-worker:${{ env.VERSION }}
          build-args: CONTROL_HUB_BUILD=${{ needs.gate.outputs.build }}
          sbom: ${{ needs.gate.outputs.channel == 'release' }}
          provenance: ${{ needs.gate.outputs.channel == 'release' && 'mode=max' || false }}
          cache-from: type=gha,scope=control-hub-worker
          cache-to: type=gha,mode=max,scope=control-hub-worker

      - name: Build and push the migrate image
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/control-hub-migrate:${{ env.VERSION }}
          build-args: CONTROL_HUB_BUILD=${{ needs.gate.outputs.build }}
          sbom: ${{ needs.gate.outputs.channel == 'release' }}
          provenance: ${{ needs.gate.outputs.channel == 'release' && 'mode=max' || false }}
          cache-from: type=gha,scope=control-hub-migrate
          cache-to: type=gha,mode=max,scope=control-hub-migrate

      - name: Build and push the web image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/control-hub-web:${{ env.VERSION }}
          build-args: CONTROL_HUB_BUILD=${{ needs.gate.outputs.build }}
          sbom: ${{ needs.gate.outputs.channel == 'release' }}
          provenance: ${{ needs.gate.outputs.channel == 'release' && 'mode=max' || false }}
          cache-from: type=gha,scope=control-hub-web
          cache-to: type=gha,mode=max,scope=control-hub-web

      - name: Install cosign
        if: needs.gate.outputs.channel == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the four digests
        if: needs.gate.outputs.channel == 'release'
        shell: bash
        env:
          API: ${{ steps.api.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          # By digest, never by tag. A signature over a tag says nothing a week later, because the
          # tag can be moved and the signature still verifies -- against different bytes.
          for pair in "api:$API" "worker:$WORKER" "migrate:$MIGRATE" "web:$WEB"; do
            service="${pair%%:*}"
            digest="${pair#*:}"
            cosign sign --yes "$REGISTRY/control-hub-$service@$digest"
          done

      - name: Write the release manifest
        if: needs.gate.outputs.channel == 'release'
        shell: bash
        env:
          API: ${{ steps.api.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          digests=$(jq -nc --arg api "$API" --arg worker "$WORKER" --arg migrate "$MIGRATE" --arg web "$WEB" \
            '{api: $api, worker: $worker, migrate: $migrate, web: $web}')
          node scripts/release-manifest.mjs \
            --tag "$GITHUB_REF_NAME" \
            --registry "$REGISTRY" \
            --digests "$digests" \
            --out release.json
          cat release.json

      - name: Attach the manifest to the release
        if: needs.gate.outputs.channel == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An installation reads this at a URL that never changes:
          #   https://github.com/$GITHUB_REPOSITORY/releases/latest/download/release.json
          # which is why the asset name is fixed and why the manifest belongs on the release rather
          # than somewhere a version number has to be substituted in.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release.json --clobber

      - name: Say what was published
        shell: bash
        # Through the environment rather than interpolated into the script. Everything here comes
        # from our own gate job, but `${{ }}` inside a `run:` is textual substitution: the shell
        # sees the value as source code, so a value with a quote in it stops being a value.
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
          BUILD: ${{ needs.gate.outputs.build }}
          API: ${{ steps.api.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "### $CHANNEL \`$VERSION\`"
            echo
            echo "Build \`$BUILD\`"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            for pair in "api:$API" "worker:$WORKER" "migrate:$MIGRATE" "web:$WEB"; do
              echo "| \`$REGISTRY/control-hub-${pair%%:*}\` | \`${pair#*:}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
