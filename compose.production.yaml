services:
  web:
    # The web tier deliberately has no secret mounts.
    secrets: []

  api:
    environment:
      SECRETS_PROVIDER: ${SECRETS_PROVIDER:-runtime_files}
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      BETTER_AUTH_SECRET: !reset null
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      # The issuer MCP clients compare against. Here rather than in the base file because it is this
      # installation's own public origin, which only a real installation knows, and required rather
      # than defaulted for the same reason as the relay below: the schema demands a bare origin, so
      # an empty value fails at boot instead of defaulting, and an origin invented here would be one
      # no client could ever match. The installer has always written it to .env; nothing read it.
      MCP_ISSUER: ${MCP_ISSUER:?MCP_ISSUER is required in production}
      # The base file points these at Mailpit, which is right for development and is a catch-all
      # that accepts anything for anybody. A production installation has to name a real relay, and
      # `SMTP_HOST` is required rather than defaulted for that reason: a default here would be an
      # installation that silently keeps delivering the Owner's password-reset link to a container
      # on the same machine.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required in production}
    secrets:
      - source: database_url
        target: database_url
      - source: better_auth_secret
        target: better_auth_secret

  worker:
    environment:
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - source: database_url
        target: database_url

  migrate:
    environment:
      # The reset has to name the same variable the base file sets, or both a direct value and a
      # file reach the entrypoint and it refuses the pair as `SECRET_SOURCE_CONFLICT`.
      MIGRATION_DATABASE_URL: !reset null
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - source: migration_database_url
        target: migration_database_url

  # The first Owner, in production. Same job as in the base file, with the credentials arriving as
  # mounted files instead of environment values -- and the mail settings that decide whether the
  # only link into that account ever leaves the building.
  bootstrap:
    environment:
      SECRETS_PROVIDER: ${SECRETS_PROVIDER:-runtime_files}
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      MIGRATION_DATABASE_URL: !reset null
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      BETTER_AUTH_SECRET: !reset null
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required in production}
    secrets:
      - source: migration_database_url
        target: migration_database_url
      - source: better_auth_secret
        target: better_auth_secret

  # Mailpit does not run on a customer's server.
  #
  # It is a development mail catcher with `MP_SMTP_AUTH_ACCEPT_ANY`, and although it only publishes
  # on 127.0.0.1 it has no business on a machine that holds a customer's data. A profile is how it
  # goes away without changing how development or CI start the stack: those never load this file,
  # so nothing there moves, and here the service becomes one that has to be asked for by name.
  mailpit:
    profiles: ["mail-catcher"]

  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_APP_PASSWORD: !reset null
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
      - source: postgres_app_password
        target: postgres_app_password

# The files themselves. No `uid`, `gid` or `mode` here or on the mounts above: Compose ignores all
# three -- they are Swarm attributes, and it warns about them on every single run -- and a secret
# declared with `file:` is bind-mounted carrying the ownership it has on the host. So the reader's
# identity is decided by `deploy/install.sh`, which gives PostgreSQL's two to uid 70 and the rest to
# uid 1000, and by nothing in this file. Writing them here again would only restore the appearance
# that this is settled somewhere it is not.
secrets:
  database_url:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/database_url
  migration_database_url:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/migration_database_url
  better_auth_secret:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/better_auth_secret
  postgres_admin_password:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/postgres_admin_password
  postgres_app_password:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/postgres_app_password
