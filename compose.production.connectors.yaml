services:
  api:
    environment:
      CONNECTOR_KEY_RING: !reset null
      CONNECTOR_KEY_RING_FILE: /run/secrets/connector_key_ring
    secrets:
      - source: connector_key_ring
        target: connector_key_ring
        uid: "1000"
        gid: "1000"
        mode: 0400

  worker:
    environment:
      CONNECTOR_KEY_RING: !reset null
      CONNECTOR_KEY_RING_FILE: /run/secrets/connector_key_ring
    secrets:
      - source: connector_key_ring
        target: connector_key_ring
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  connector_key_ring:
    file: ${SECRETS_DIRECTORY:?SECRETS_DIRECTORY is required}/connector_key_ring
